name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The cmdline-tools version is pinned: the newest ones make the action fail with
      # "Failed to find package 'tools'".
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: yes
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}

      - name: Run the unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build the release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: minimal-tv-launcher
          path: app/build/outputs/apk/release/app-release-unsigned.apk
